<style>
:root{--bg:#121214;--panel:#1b1b1f;--panel2:#232328;--ink:#ededf0;--muted:#a0a0a9;--line:#35353c;--red:#d6121f;--red-t:#ff5560;--ok:#4cd07d;--warn:#f2b84b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Roboto,system-ui,sans-serif}
h1,h2,h3{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;margin:0;font-weight:700;letter-spacing:.02em}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:2px solid var(--red);flex-wrap:wrap}
header img{width:44px;height:44px;border-radius:8px}
header h1{font-size:26px}
header .sp{flex:1}
button,select,input{font:inherit;color:var(--ink)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--red-t)}
.btn.red{background:var(--red);border-color:var(--red)}
nav{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:Oswald,sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--red)}
main{padding:18px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:20px;margin-bottom:10px;color:var(--red-t)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:500;font-size:13px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;background:var(--panel2);padding:8px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:70px}
input:focus,select:focus{outline:2px solid var(--red-t);border-color:transparent}
select{min-width:125px}
input[type=checkbox]{width:20px;height:20px;min-width:0;accent-color:var(--red)}
input[type=number]{text-align:right}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:Oswald,sans-serif;font-size:30px;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.good{color:var(--ok)}.bad{color:var(--red-t)}.warn{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:0 6px}
.del:hover{color:var(--red-t)}
.note{color:var(--muted);font-size:13px}
.rules li{margin:6px 0}
@media(max-width:600px){.g2{grid-template-columns:1fr}main{padding:10px}}
</style>
</head>

<script>
const DRUGS=["Cannabis","Cocaine","Mexicana","Ecstasy","Lean","B-Magic","Sporex","Héroine"];
const ACTS=["ATM","Superette","Cambriolage","Go Fast","Conteneur","Darknet"];
const FL=["Fleeca","Armurerie","Bijouterie"];
const KEY="grey-varso-v1";
const $=s=>document.querySelector(s);
const fmt=n=>(Math.round(n)||0).toLocaleString("fr-FR").replace(/ | /g," ")+" $";
const num=v=>parseFloat(v)||0;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fresh(){
  const names=["Dali Junior","Connor Saintclaire"];
  const grades=["Lead","Co-Lead"];
  return {
    from:"",to:"",
    p:{seuil:100000,pMin:30,pMax:35,labo:5000,d100:5000,trans:3000,qD:300,qA:15,qL:2},
    m:Array.from({length:10},(_,i)=>({nom:names[i]||"Membre "+(i+1),grade:grades[i]||"",tel:"",rib:"",id:"",statut:"À verser",trans:0,bonus:0,propre:0,depense:0,dr:[],ac:[]})),
    fl:[],lab:[],rec:[]
  };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.m)S=fresh();
S.p=Object.assign(fresh().p,S.p||{});
let tab="stats",sel=0;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$("#saved").textContent="Enregistré"}catch(e){$("#saved").textContent="Non enregistré"}}

/* ---------- calculs ---------- */
function calcM(m){
  const sale_d=m.dr.reduce((a,r)=>a+num(r.montant),0), q_d=m.dr.reduce((a,r)=>a+num(r.qte),0);
  const sale_a=m.ac.reduce((a,r)=>a+num(r.montant),0), q_a=m.ac.length;
  const part=m.ac.reduce((a,r)=>{const x=num(r.montant);return a+x*((x>=S.p.seuil?S.p.pMax:S.p.pMin)/100)},0);
  const gd=Math.floor(q_d/100)*S.p.d100;
  const labs=S.lab.filter(r=>r.membre===m.nom).reduce((a,r)=>a+num(r.labos),0);
  const branches=S.lab.filter(r=>r.membre===m.nom).reduce((a,r)=>a+num(r.branches),0);
  const gl=labs*S.p.labo, gt=num(m.trans)*S.p.trans;
  const total=part+gd+gl+gt+num(m.bonus);
  const ok=q_d>=S.p.qD&&q_a>=S.p.qA&&labs>=S.p.qL;
  return {sale_d,q_d,sale_a,q_a,sale:sale_d+sale_a,part,gd,labs,branches,gl,gt,total,ok};
}
const C=()=>S.m.map(calcM);
const flTot=a=>S.fl.filter(r=>!a||r.action===a).reduce((s,r)=>s+num(r.somme),0);
const flNb=a=>S.fl.filter(r=>r.action===a).length;

/* ---------- helpers UI ---------- */
function bind(path,type){ // returns attribute string
  return `data-b="${path}" data-t="${type||"s"}"`;
}
function getP(path){return path.split(".").reduce((o,k)=>o?.[k],S)}
function setP(path,val){const k=path.split(".");const last=k.pop();const o=k.reduce((o,x)=>o[x],S);o[last]=val}
function inp(path,type,extra=""){
  const v=getP(path);
  if(type==="c")return `<input type="checkbox" ${bind(path,"c")} ${v?"checked":""}>`;
  if(type==="n")return `<input type="number" step="any" ${bind(path,"n")} value="${v??""}" ${extra}>`;
  return `<input type="${type==="d"?"text":"text"}" ${bind(path,"s")} value="${esc(v)}" ${extra}>`;
}
function sel_(path,opts,blank=true){
  const v=getP(path)||"";
  return `<select ${bind(path,"s")}>${blank?'<option value=""></option>':""}${opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
}
function memberOpts(){return S.m.map(m=>m.nom)}
const now=()=>{const d=new Date();const p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`};

/* ---------- vues ---------- */
const TABS=[["stats","Stats"],["fiches","Fiches"],["fleeca","Fleeca / Armurerie"],["labo","Laboratoire"],["rec","Récoltes"],["sal","Salaires"],["admin","🔒 Admin"]];
function renderNav(){
  $("#nav").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${l}</button>`).join("");
}
function kpi(label,val,cls=""){return `<div class="kpi"><b class="${cls}">${val}</b><span>${label}</span></div>`}

function vStats(){
  const c=C();
  const T=k=>c.reduce((a,x)=>a+x[k],0);
  const rows=S.m.map((m,i)=>`<tr><td>${esc(m.nom)}</td><td class="n">${c[i].q_d}</td><td class="n">${c[i].q_a}</td><td class="n">${c[i].labs}</td><td class="n">${fmt(c[i].sale)}</td><td>${c[i].ok?"✅":"❌"}</td></tr>`).join("");
  const acts=ACTS.map(a=>{
    const all=S.m.flatMap(m=>m.ac.filter(r=>r.action===a));
    return `<tr><td>${a}</td><td class="n">${fmt(all.reduce((s,r)=>s+num(r.montant),0))}</td><td class="n">${all.length}</td></tr>`}).join("");
  const fiches=T("sale"), caisse=fiches+flTot();
  return `

  <div class="grid g2"><div class="card"><h2>Caisse du groupe</h2><table>

  <div class="card"><h2>Règles</h2><ul class="rules">
   <li>Actions : part membre de ${S.p.pMin} % si l'action est &lt; ${fmt(S.p.seuil)}, ${S.p.pMax} % si ≥ ${fmt(S.p.seuil)}. Fleeca / Armurerie : 100 % pour la caisse.</li>
   <li>Laboratoires : ${S.p.qL} minimum par semaine (obligatoire), ${fmt(S.p.labo)} par labo. 100 de drogue vendus : ${fmt(S.p.d100)}. Transaction : ${fmt(S.p.trans)}.</li></ul></div>`;
}

function vAdmin(){
  const c=C();
  const rows=S.m.map((m,i)=>`<tr><td>${inp(`m.${i}.nom`,"s")}</td><td>${inp(`m.${i}.grade`,"s")}</td><td>${inp(`m.${i}.tel`,"s")}</td><td>${inp(`m.${i}.rib`,"s")}</td><td>${inp(`m.${i}.id`,"s")}</td></tr>`).join("");
  const pay=S.m.map((m,i)=>`<tr><td>${esc(m.nom)}</td><td>${esc(m.tel)}</td><td>${esc(m.rib)}</td><td>${esc(m.id)}</td><td class="n">${fmt(c[i].total)}</td><td>${esc(m.statut)}</td></tr>`).join("");

  <div class="card"><h2>Paramètres</h2><div class="row2">
   ${P("seuil","Seuil par action ($)")}${P("pMin","Part membre sous le seuil (%)")}${P("pMax","Part membre au-dessus (%)")}

   <tr class="tot"><td colspan="4">TOTAL À VERSER</td><td class="n">${fmt(c.reduce((a,x)=>a+x.total,0))}</td><td></td></tr></table></div></div>

function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
const ADMIN_HASH=4442493394655713;
let unlocked=false;try{unlocked=sessionStorage.getItem("gv-admin")==="1"}catch(e){}
function tryUnlock(){
  const v=($("#pin")||{}).value||"";
  if(cyrb53("greyvarso:"+v.trim().toLowerCase())===ADMIN_HASH){unlocked=true;try{sessionStorage.setItem("gv-admin","1")}catch(e){}render()}
  else{const m=$("#pinmsg");if(m)m.textContent="Code incorrect"}
}
function vLock(){return `<div class="card" style="max-width:420px;margin:40px auto"><h2>🔒 Zone admin</h2><p class="note">Accès réservé. Entre le code admin.</p>
  <input id="pin" type="password" placeholder="Code admin" autocomplete="off"><p id="pinmsg" class="bad"></p>
  <button class="btn red" data-unlock="1">Déverrouiller</button></div>`}
function vAdminGate(){return unlocked?`<p><button class="btn" data-lock="1">🔒 Verrouiller l'admin</button></p>`+vAdmin():vLock()}
const VIEWS={stats:vStats,fiches:vFiches,fleeca:vFleeca,labo:vLabo,rec:vRec,sal:vSal,admin:vAdminGate};
function refresh(){
  const m=$("#main"),tmp=document.createElement("div");
  tmp.innerHTML=VIEWS[tab]();
  const A=m.querySelectorAll("*"),B=tmp.querySelectorAll("*");
  if(A.length!==B.length){const f=document.activeElement;render();return}
  A.forEach((a,i)=>{
    const b=B[i];
    if(a.tagName!==b.tagName)return;
    if(a.matches("input,select,option,textarea"))return;
    if(a.children.length===0){
      if(a.textContent!==b.textContent)a.textContent=b.textContent;
      if(a.className!==b.className)a.className=b.className;
    }
  });
}
function render(){renderNav();$("#main").innerHTML=VIEWS[tab]()}

/* ---------- événements ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.unlock){tryUnlock();return}
  if(t.dataset.lock){unlocked=false;try{sessionStorage.removeItem("gv-admin")}catch(e){}render();return}
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.sel!==undefined){sel=+t.dataset.sel;render();return}
  if(t.dataset.add){
    const a=t.dataset.add;
    if(a==="dr")S.m[sel].dr.push({date:now(),drogue:"",qte:"",montant:"",valide:false});
    if(a==="ac")S.m[sel].ac.push({date:now(),action:"",qte:1,montant:"",valide:false});
    if(a==="fl")S.fl.push({date:now().split(" ")[0],action:"",somme:"",objets:"",dh:now(),qui:"",acc1:"",acc2:"",cp:false});
    if(a==="lab")S.lab.push({dh:now(),membre:"",labos:1,branches:"",note:""});
    if(a==="rec")S.rec.push({dh:now(),membre:"",matiere:"",qte:"",note:""});
    save();render();return}
  if(t.dataset.del){
    const k=t.dataset.del.split(".");const idx=+k.pop();const arr=k.reduce((o,x)=>o[x],S);
    arr.splice(idx,1);save();render();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pin")tryUnlock()});
document.addEventListener("input",e=>{
  const el=e.target;if(!el.dataset.b)return;
  const v=el.dataset.t==="c"?el.checked:el.dataset.t==="n"?(el.value===""?"":parseFloat(el.value)):el.value;
  setP(el.dataset.b,v);save();refresh();
});
document.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset.b)return;
  refresh();
});
$("#bExport").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
  a.download="grey-varso-"+new Date().toISOString().slice(0,10)+".json";a.click()};
$("#bImport").onclick=()=>$("#file").click();
$("#file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.m)throw 0;S=d;S.p=Object.assign(fresh().p,S.p||{});save();render()}catch(x){alert("Fichier invalide")}};r.readAsText(f);e.target.value=""};
$("#bReset").onclick=()=>{
  if(!confirm("Nouvelle semaine : on efface les ventes, actions, labos, récoltes et statuts. Les membres et paramètres restent. Pense à exporter avant. Continuer ?"))return;
  S.m.forEach(m=>{m.dr=[];m.ac=[];m.trans=0;m.bonus=0;m.statut="À verser"});S.fl=[];S.lab=[];S.rec=[];S.from="";S.to="";save();render()};
render();
</script>
